<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Royal Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Playfair Display', 'Times New Roman', serif;
            background: #fef9f0;
            color: #2c2b28;
        }
        nav {
            background: #1a1a1a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #d4af37;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #d4af37; }
        .contact-hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&h=400&fit=crop');
            background-size: cover;
            background-position: center;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .contact-hero h1 {
            font-size: 3.5rem;
        }
        .contact-container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            justify-content: space-between;
        }
        .info {
            flex: 1;
            min-width: 250px;
        }
        .info h2 {
            color: #d4af37;
            margin-bottom: 1rem;
        }
        .info p {
            margin: 1rem 0;
            line-height: 1.6;
        }
        .form {
            flex: 1;
            min-width: 280px;
        }
        .form input, .form textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
        .form button {
            background: #d4af37;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .form button:hover {
            background: #b8962e;
        }
        footer {
            background: #1a1a1a;
            color: #aaa;
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
        }
        .map {
            margin-top: 2rem;
        }
        @media (max-width: 700px) {
            .contact-hero h1 { font-size: 2rem; }
            nav { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">THE ROYAL TABLE</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="contact-hero">
        <h1>Reserve Your Table</h1>
    </div>

    <div class="contact-container">
        <div class="info">
            <h2>📍 Visit Us</h2>
            <p>123, Luxury Avenue, <br>Vesu, Surat - 395007</p>
            <h2>📞 Call</h2>
            <p>+91 98765 43210</p>
            <h2>✉️ Email</h2>
            <p>reservations@royaltable.com</p>
            <div class="map">
                <iframe src="https://maps.google.com/maps?q=surat&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="200" style="border:0; border-radius: 16px;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        <div class="form">
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Phone Number">
                <textarea rows="4" placeholder="Message / Reservation request"></textarea>
                <button type="submit">Send Inquiry</button>
            </form>
            <p style="font-size: 0.8rem; margin-top: 1rem; color: #777;">*We’ll respond within 24 hours</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 The Royal Table – Luxury Dining. All rights reserved.</p>
    </footer>
</body>
</html>
